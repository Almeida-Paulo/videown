[package]
name = "videown"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Servidor web leve para baixar vídeos e áudios com yt-dlp"

# Sem dependências: só a biblioteca padrão do Rust.
[dependencies]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
